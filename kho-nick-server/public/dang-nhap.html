<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đăng nhập | Kho Nick</title>
<meta name="description" content="Đăng nhập tài khoản Kho Nick để tạo đơn, nạp tiền và theo dõi đơn hàng.">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#0b7a63">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<!--include:header-->
<div class="wrap">
  <main id="app">
    <div class="narrow"><section class="panel">
      <h1 class="h2">Đăng nhập</h1>
      <div id="msg"></div>
      <form id="form" data-mode="login" novalidate>
        <div class="field"><label for="f-user">Tên đăng nhập</label><input id="f-user" autocomplete="username" required maxlength="24"></div>
        <div class="field"><label for="f-pass">Mật khẩu</label><input id="f-pass" type="password" autocomplete="current-password" required></div>
        <button class="btn primary" style="width:100%" type="submit">Đăng nhập</button>
        <div style="margin-top:12px;text-align:right;">
          <a href="/quen-mat-khau" style="font-size:14px;color:var(--primary);text-decoration:none;">Quên mật khẩu?</a>
        </div>
      </form>
      <p style="margin:14px 0 0;color:var(--muted)">Chưa có tài khoản? <a href="/dang-ky">Đăng ký</a></p>
    </section></div>
  </main>
  <!--include:footer-->
</div>
<script src="/js/common.js" defer></script>
<script src="/js/auth.js" defer></script>
</body>
</html>
