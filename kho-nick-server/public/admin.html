<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Quản trị hệ thống | Kho Nick</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

<!-- Màn hình đăng nhập Admin -->
<div id="admin-auth" class="admin-auth-wrap">
  <div class="admin-auth-card">
    <div class="admin-auth-brand">
      <div class="admin-auth-logo">K</div>
      <div>
        <div style="font:800 18px var(--f-head)">Kho Nick</div>
        <div style="font-size:12px;color:var(--muted)">Hệ thống quản trị vận hành</div>
      </div>
    </div>
    <h1 class="admin-auth-title">Đăng nhập Quản trị</h1>
    <p class="admin-auth-sub">Nhập khóa quản trị (<code>ADMIN_KEY</code>) để truy cập bảng điều khiển. Khóa chỉ lưu trong phiên làm việc hiện tại.</p>
    <div id="auth-msg"></div>
    <form id="auth-form">
      <div class="field">
        <label for="key">Khóa quản trị (ADMIN_KEY)</label>
        <input id="key" type="password" placeholder="Nhập ADMIN_KEY..." autocomplete="off" required>
      </div>
      <button class="btn primary" style="width:100%" type="submit" id="auth-btn">Truy cập quản trị</button>
    </form>
    <p style="margin:14px 0 0;font-size:13px;color:var(--muted);text-align:center"><a href="/">← Quay về trang chủ Kho Nick</a></p>
  </div>
</div>

<!-- Giao diện quản trị chính -->
<div id="admin-app" class="admin-shell" hidden>
  <div id="sb-overlay" class="admin-sb-overlay" hidden></div>
  <aside class="admin-sidebar" id="admin-sidebar" aria-label="Menu quản trị">
    <div class="admin-sb-head">
      <a class="admin-sb-brand" href="/"><i style="width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);font:800 14px var(--f-head);font-style:normal">K</i>Kho Nick</a>
      <span class="admin-sb-badge">Admin</span>
    </div>
    <nav class="admin-nav" id="admin-nav">
      <button type="button" class="admin-nav-btn is-active" data-tab="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        <span>Tổng quan</span>
      </button>
      <button type="button" class="admin-nav-btn" data-tab="users">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Quản lý người dùng</span>
      </button>
      <button type="button" class="admin-nav-btn" data-tab="orders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>Quản lý đơn hàng</span>
      </button>
      <button type="button" class="admin-nav-btn" data-tab="topups">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        <span>Quản lý nạp tiền</span>
        <span class="admin-nav-pill" id="nav-topup-badge" hidden>0</span>
      </button>
      <button type="button" class="admin-nav-btn" data-tab="balances">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
        <span>Quản lý số dư</span>
      </button>
      <button type="button" class="admin-nav-btn" data-tab="transactions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>Lịch sử giao dịch</span>
      </button>
      <button type="button" class="admin-nav-btn" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Cấu hình website</span>
      </button>
      <button type="button" class="admin-nav-btn" data-tab="logs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>Nhật ký hoạt động</span>
      </button>
    </nav>
    <div class="admin-sb-foot">
      <button type="button" class="admin-nav-btn is-danger" id="admin-logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Đăng xuất Admin</span>
      </button>
    </div>
  </aside>

  <div class="admin-workspace">
    <header class="admin-topbar">
      <div class="admin-topbar-left">
        <button type="button" class="admin-menu-toggle" id="sb-toggle" aria-label="Mở menu">☰</button>
        <h1 class="admin-page-title" id="admin-view-title">Tổng quan hệ thống</h1>
      </div>
      <div class="admin-topbar-right">
        <span class="admin-status-dot">Đã xác thực Admin</span>
        <button type="button" class="btn sm" id="admin-global-refresh">Làm mới</button>
      </div>
    </header>
    <main class="admin-main" id="admin-content"></main>
  </div>
</div>

<!-- Hộp thoại xác nhận & chi tiết -->
<div id="admin-modal-root"></div>
<div id="toast" hidden></div>

<script src="/js/admin.js" defer></script>
</body>
</html>
